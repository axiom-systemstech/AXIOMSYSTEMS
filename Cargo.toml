[package]
name = "axiom-systems"
version = "0.1.0"
edition = "2024"
authors = ["AXIOM SYSTEMS <ceo@axiom.systems>"]
description = "AXIOM - El primer ecosistema tecnológico completo construido desde cero"
license = "MIT OR Apache-2.0"
repository = "https://github.com/axiomsystems-tech/AXIOM-SYSTEMS"
readme = "README.md"
categories = ["compilers", "programming-languages", "ecosystem"]
keywords = ["language", "compiler", "vm", "ecosystem", "axiom"]

[lib]
name = "axiom_core"

[dependencies]
thiserror = "1.0"
anyhow = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"
clap = { version = "4.5", features = ["derive", "color"] }
colored = "2.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[dev-dependencies]
criterion = "0.5"
pretty_assertions = "1.4"

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
