[package]
name = "axiom-systems"
version = "0.1.0"
edition = "2024"
authors = ["AXIOM SYSTEMS <ceo@axiom.systems>"]
description = "El primer ecosistema tecnológico completo construido desde cero"
license = "MIT OR Apache-2.0"
repository = "https://github.com/axiom-systemstech/axiom-systemstech"
readme = "README.md"
categories = ["compilers", "programming-languages", "ecosystem"]
keywords = ["language", "compiler", "vm", "ecosystem"]

[features]
default = ["full"]
full = ["std", "cli", "package-manager"]

[dependencies]
# Core
thiserror = "1.0"
anyhow = "1.0"
once_cell = "1.19"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
toml = "0.8"

# CLI
clap = { version = "4.5", features = ["derive", "color"] }
colored = "2.1"
indicatif = "0.17"

# File system
walkdir = "2.5"
tempfile = "3.10"
glob = "0.3"

# Async
tokio = { version = "1.38", features = ["full"] }
futures = "0.3"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
console = "0.15"

# Testing
criterion = "0.5"
pretty_assertions = "1.4"

[dev-dependencies]
rand = "0.8"
regex = "1.10"

[build-dependencies]
cc = "1.0"

[[bin]]
name = "axion"
path = "src/main.rs"

[lib]
name = "axion_core"
path = "src/lib.rs"

[profile.dev]
opt-level = 0
debug = true

[profile.release]
opt-level = 3
debug = false
lto = true
codegen-units = 1
strip = true
